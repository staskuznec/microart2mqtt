name: Релиз

# Имя запуска в списке Actions. Без него все сборки называются одинаково, и
# понять, что собиралось, можно только заглянув внутрь.
run-name: >-
  ${{ github.ref_type == 'tag'
      && format('Релиз {0}', github.ref_name)
      || format('Проверка ветки {0}', github.ref_name) }}

# Сборка идёт по тегу вида v0.1.0. Ветка сама по себе релиза не даёт: на
# объекте должно быть понятно, какая именно версия там стоит, а «последний
# коммит в main» таким ответом не является.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write # нужно, чтобы создать релиз и приложить к нему файлы

jobs:
  test:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4
      - name: Поставить Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Форматирование
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Статический анализ
        run: go vet ./...
      - name: Тесты с проверкой гонок
        run: go test -race ./...
      - name: Синтаксис установщика
        run: sh -n install.sh

  build:
    name: Сборка
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
          - goarch: arm
            goarm: "7"
            suffix: linux-armv7
          - goarch: arm64
            suffix: linux-arm64
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v4
      - name: Поставить Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Сборка под ${{ matrix.suffix }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          # SQLite взят чистый на Go, поэтому кросс-компиляция обходится без
          # тулчейна и собирается статически.
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          go build -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "microart2mqtt-${{ matrix.suffix }}" ./cmd/microart2mqtt

      - name: Сохранить бинарник
        uses: actions/upload-artifact@v4
        with:
          name: microart2mqtt-${{ matrix.suffix }}
          path: microart2mqtt-${{ matrix.suffix }}
          retention-days: 7

  release:
    name: Публикация
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Забрать исходники с историей
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Тег должен стоять на main
        # Релиз собирается только из main: на объекте должно быть понятно, что
        # именно там стоит, а тег с ветки разработки такой гарантии не даёт.
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Тег $GITHUB_REF_NAME не входит в main — релиз не собираем." >&2
            exit 1
          }

      - name: Собрать бинарники всех платформ
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Контрольные суммы
        # Установщик скачивает бинарник по сети и ставит его в систему. Без
        # сверки суммы это означало бы «запустить то, что пришло», поэтому
        # файл сумм обязателен.
        run: sha256sum microart2mqtt-* > SHA256SUMS

      - name: Что вошло в релиз
        run: |
          {
            printf '## %s\n\n' "$GITHUB_REF_NAME"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            printf '\n### Собрано\n\n'
            printf '| файл | размер | sha256 |\n|---|---:|---|\n'
            for f in microart2mqtt-*; do
              printf '| `%s` | %s | `%s` |\n' \
                "$f" \
                "$(du -h "$f" | cut -f1)" \
                "$(sha256sum "$f" | cut -c1-16)…"
            done
            printf '\n### Установка\n\n'
            printf '```\ncurl -fsSL https://github.com/%s/releases/latest/download/install.sh | sudo sh\n```\n' \
              "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Описание релиза из сообщения тега
        # Сообщение тега — это и есть «что и зачем»: оно пишется осознанно, а
        # автосписок коммитов сам по себе объясняет мало.
        run: git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            microart2mqtt-*
            SHA256SUMS
            deploy/microart2mqtt.service
            deploy/mimisetup-microart-tab.js
            install.sh
          generate_release_notes: true
